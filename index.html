<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>SpeakerJump</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0284c7" />
<style>
  :root{
    --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --card: #ffffff;
    --primary: #0284c7;
    --primary-dark: #0369a1;
    --text: #1e293b;
    --text-secondary: #64748b;
    --border: #e2e8f0;
    --success: #10b981;
    --error: #ef4444;
    --shadow: rgba(0,0,0,0.1);
    --shadow-lg: rgba(0,0,0,0.15);
    --radius: 16px;
    --radius-sm: 8px;
    --avatar: 56px;
    --halo: 16px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    padding: 12px;
    padding-bottom: 160px;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 20px 60px var(--shadow-lg);
  }

  h1 { font-size: 24px; text-align: center; color: var(--primary); margin-bottom: 16px; }

  .seek-container { background: #f8fafc; padding: 16px; border-radius: var(--radius-sm); margin-bottom: 16px; }

  input[type="range"] { width: 100%; height: 12px; border-radius: 6px; background: #e2e8f0; -webkit-appearance: none; margin: 12px 0; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 32px; height: 32px; border-radius: 50%; background: var(--primary); cursor: pointer; }

  .time { display: flex; justify-content: space-between; color: var(--text-secondary); font-size: 14px; font-weight: 600; }

  .speakers-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; margin: 16px 0; min-height: 100px; }

  .speaker { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 110px; transition: transform 0.2s; }
  .speaker.active { transform: scale(1.1); }
  .speaker-avatar { width: var(--avatar); height: var(--avatar); border-radius: 50%; overflow: hidden; background: #e2e8f0; border: 3px solid transparent; }
  .speaker.active .speaker-avatar { border-color: var(--primary); box-shadow: 0 0 15px var(--primary); }
  .speaker-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .speaker-name { font-size: 14px; font-weight: 700; color: var(--text); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; }

  .controls {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 12px; border-top: 2px solid var(--border); box-shadow: 0 -8px 32px var(--shadow);
  }

  button {
    background: var(--primary); color: white; border: none; border-radius: var(--radius-sm); padding: 10px; font-weight: 700; cursor: pointer; flex: 1; min-height: 44px;
  }
  button:disabled { background: #cbd5e1; }

  .status { margin-top: 16px; padding: 12px; border-radius: var(--radius-sm); text-align: center; font-size: 14px; background: #f8fafc; }
  .status.success { color: var(--success); border: 1px solid var(--success); }

  @media (max-width: 600px) {
    .controls { padding: 10px; }
    button { font-size: 12px; }
  }
</style>
</head>
<body>
  <div class="container">
    <h1>🎧 SpeakerJump</h1>
    <div class="seek-container">
      <input id="seekBar" type="range" min="0" max="100" value="0" disabled />
      <div class="time"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
    </div>
    <div id="speakersGrid" class="speakers-grid"></div>
    <div id="status" class="status">Load files to begin</div>
  </div>

  <div class="controls">
    <button onclick="document.getElementById('transcriptInput').click()">📄 Transcript</button>
    <input id="transcriptInput" type="file" accept=".jsonl,.json" hidden />
    <button onclick="document.getElementById('audioInput').click()">🔊 Audio</button>
    <input id="audioInput" type="file" accept="audio/*" hidden />
    <button id="playPauseBtn" disabled>▶️ Play</button>
    <button id="rewindBtn">⏪ -30s</button>
    <button id="skipBtn">⏭️ +30s</button>
  </div>

  <audio id="audioPlayer" preload="metadata"></audio>

<script>
// PWA Service Worker Registration
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

const $ = s => document.querySelector(s);
const audio = $('#audioPlayer');
const playBtn = $('#playPauseBtn');
const seekBar = $('#seekBar');
let speakers = [];
let events = [];
let startTimestamp = null;

// Audio Controls
$('#audioInput').onchange = e => {
  const f = e.target.files[0];
  audio.src = URL.createObjectURL(f);
  playBtn.disabled = false;
  seekBar.disabled = false;
  $('#status').textContent = `Loaded: ${f.name}`;
  $('#status').className = 'status success';
};

playBtn.onclick = () => {
  if (audio.paused) { audio.play(); playBtn.textContent = '⏸️ Pause'; }
  else { audio.pause(); playBtn.textContent = '▶️ Play'; }
};

$('#rewindBtn').onclick = () => audio.currentTime = Math.max(audio.currentTime - 30, 0);
$('#skipBtn').onclick = () => audio.currentTime = Math.min(audio.currentTime + 30, audio.duration);

audio.ontimeupdate = () => {
  seekBar.value = audio.currentTime;
  $('#currentTime').textContent = Math.floor(audio.currentTime/60) + ":" + String(Math.floor(audio.currentTime%60)).padStart(2,'0');
  updateActiveUI();
};

audio.onloadedmetadata = () => {
  seekBar.max = audio.duration;
  $('#duration').textContent = Math.floor(audio.duration/60) + ":" + String(Math.floor(audio.duration%60)).padStart(2,'0');
};

seekBar.oninput = () => audio.currentTime = seekBar.value;

// Transcript Logic
$('#transcriptInput').onchange = e => {
  const reader = new FileReader();
  reader.onload = ev => {
    const lines = ev.target.result.split('\n');
    const seen = new Map();
    events = [];
    lines.forEach(line => {
      if(!line.trim()) return;
      const data = JSON.parse(line);
      const p = data.payload || data;
      const uid = p.user_id || (p.body && p.body.sender);
      if(uid) {
        if(!seen.has(uid)) seen.set(uid, {userId: uid, displayName: uid});
        const isStart = line.includes('START') || line.includes('"type":17');
        events.push({ts: p.timestamp || p.ts, userId: uid, isSpeaking: isStart});
      }
    });
    speakers = Array.from(seen.values());
    startTimestamp = events[0]?.ts;
    renderSpeakers();
  };
  reader.readAsText(e.target.files[0]);
};

function renderSpeakers() {
  const grid = $('#speakersGrid');
  grid.innerHTML = '';
  speakers.forEach(s => {
    const div = document.createElement('div');
    div.className = 'speaker';
    div.id = `spk-${s.userId}`;
    div.innerHTML = `<div class="speaker-avatar"></div><div class="speaker-name">${s.displayName}</div>`;
    grid.appendChild(div);
  });
}

function updateActiveUI() {
  if(!startTimestamp) return;
  const now = startTimestamp + (audio.currentTime * 1000);
  const active = new Set();
  events.forEach(e => {
    if(e.ts <= now) {
      if(e.isSpeaking) active.add(e.userId);
      else active.delete(e.userId);
    }
  });
  document.querySelectorAll('.speaker').forEach(el => {
    el.classList.toggle('active', active.has(el.id.replace('spk-','')));
  });
}
</script>
</body>
</html>
